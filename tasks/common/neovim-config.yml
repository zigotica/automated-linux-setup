---
- name: Ensure the shared Neovim configuration directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.getent_passwd[primary_user][4] }}/.config/nvim"
    state: directory
    mode: '0755'

- name: Deploy the shared Neovim configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../files/common/neovim/{{ item }}"
    dest: "{{ ansible_facts.getent_passwd[primary_user][4] }}/.config/nvim/{{ item }}"
    mode: '0644'
    directory_mode: '0755'
    backup: false
  loop:
    - init.lua
    - lazy-lock.json
    - lua/
