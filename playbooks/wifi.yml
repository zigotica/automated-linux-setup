---
- name: Manage saved Wi-Fi networks and power saving
  hosts: debian
  gather_facts: false
  any_errors_fatal: true

  pre_tasks:
    - name: Enforce explicit target selection
      ansible.builtin.import_tasks: ../tasks/validate_target.yml

  tasks:
    - name: Manage optional wifi configuration
      ansible.builtin.import_tasks: ../tasks/opts/wifi/main.yml
