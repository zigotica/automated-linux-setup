---
machine_profile: desktop
manage_wifi: true
manage_touchpad: true
manage_dns: true
manage_family: true
primary_user: zgtc
system_hostname: blauet
dns_interface: wlo1
wifi_interface: wlo1
wifi_power_save: 'off'

# Physical F-key numbers for this laptop's i3 brightness, volume, and media controls.
i3_fn_keys:
  brightness_down: 2
  brightness_up: 3
  volume_mute: 6
  volume_down: 7
  volume_up: 8
  media_previous: 9
  media_play_pause: 10
  media_next: 11

# These packages can require the non-free-firmware APT component.
# They are recorded here for the later hardware phase and are not installed by playbooks/site.yml.
hardware_packages:
  - firmware-intel-graphics
  - firmware-realtek
  - firmware-sof-signed
  - intel-microcode
