---
machine_profile: desktop
manage_wifi: true
manage_touchpad: true
manage_dns: true
manage_family: true
primary_user: zgtc
system_hostname: hpesat
keyboard_layout: es
dns_interface: wlo1
wifi_interface: wlo1
wifi_power_save: 'off'

# Keep the shared i3 configuration valid during bootstrap. Confirm the physical
# laptop key mapping before applying user configuration.
i3_fn_keys:
  brightness_down: 2
  brightness_up: 3
  volume_mute: 11
  volume_down: 9
  volume_up: 10
  media_previous: 6
  media_play_pause: 7
  media_next: 8
